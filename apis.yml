aid: motley
name: Motley
description: >-
  Motley is a Zurich-based company building a governed semantic layer for AI
  agents and business intelligence. Its open-core product, SLayer
  (motley-slayer), is a lightweight, agent-first semantic layer and query
  engine: teams model measures, dimensions, and filters once, and SLayer
  generates and executes correct SQL across Postgres, MySQL, Snowflake,
  BigQuery, ClickHouse, DuckDB and more — exposed over MCP, a REST API, a CLI, a
  Python client, Apache Arrow Flight SQL, and a Postgres facade for BI tools.
  Motley Cloud adds the managed production layer on top: hosting, OAuth-based
  access control, row-level security, versioning, and a governed reporting
  engine that turns agent queries into reports, charts, documents, and
  presentations. Founded by Egor Kraev (ex-Head of AI at Wise), Artemy
  Belousov, and Yann Ranchere; backed by Seedcamp.
