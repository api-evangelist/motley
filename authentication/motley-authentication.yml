generated: '2026-07-20'
method: searched
source: https://app.motley.ai/.well-known/oauth-authorization-server
docs: https://docs.motley.ai/slayer/getting-started/rest-api
description: >-
  Motley Cloud's API and hosted MCP server (https://app.motley.ai/api/v1/)
  authenticate with OAuth 2.0 (RFC 8414 authorization server metadata, backed by
  Clerk), authorization-code flow with PKCE and OpenID Connect. The open-source
  SLayer server run locally holds database credentials itself and does not expose
  them to consumers.
summary:
  types: [oauth2, openIdConnect]
  oauth2_flows: [authorizationCode]
  oidc: true
  pkce: [S256]
  dynamic_client_registration: true
schemes:
- name: OAuth2
  type: oauth2
  flow: authorizationCode
  issuer: https://app.motley.ai
  authorizationUrl: https://clerk.motley.ai/oauth/authorize
  tokenUrl: https://clerk.motley.ai/oauth/token
  revocationUrl: https://clerk.motley.ai/oauth/token/revoke
  registrationUrl: https://app.motley.ai/api/v1/oauth/register
  jwks_uri: https://clerk.motley.ai/.well-known/jwks.json
  token_endpoint_auth_methods: [client_secret_basic, client_secret_post, none]
  id_token_signing_alg: [RS256]
  scopes_url: scopes/motley-scopes.yml
  sources: [well-known/motley-oauth-authorization-server.json]
- name: OpenIDConnect
  type: openIdConnect
  issuer: https://app.motley.ai
  note: OIDC claims include sub, iss, aud, exp, iat, email, name, org_id.
  sources: [well-known/motley-oauth-authorization-server.json]
